[package]
name = "apex-overlays-desktop"
description = "Apex Overlays desktop app: transparent, click-through overlay windows on top of iRacing"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "apex-overlays"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
apex-core.workspace = true
apex-xr-shared.workspace = true
serde_json.workspace = true
log.workspace = true
tokio.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
# ResizeDirection is only exported from the runtime crate.
tauri-runtime = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
# Windows TLS stack (no C toolchain needed) and the system proxy.
tauri-plugin-updater = { version = "2", default-features = false, features = ["native-tls", "system-proxy"] }

# VR: window capture (Windows.Graphics.Capture + Direct3D 11) for SteamVR overlays. The same
# version Tauri already uses.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
] }
